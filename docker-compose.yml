services:
  # 1. Database Container
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Prevents data loss when container stops
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - app-network

  # 2. Kafka Container
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_container
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # 3. Backend Container
  backend:
    build: ./backend
    container_name: backend_container
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/database
      - KAFKA_BROKER=kafka:9092
    volumes:
      - ./backend:/app # Syncs your local code with the container for hot-reloading
      - /app/node_modules # Prevents local node_modules from overwriting container's
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app-network

  # 4. Frontend Container
  frontend:
    build: ./frontend
    container_name: frontend_container
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

# Define the network so they can talk to each other
networks:
  app-network:
    driver: bridge

# Define the volume to persist database data
volumes:
  mongo-data: